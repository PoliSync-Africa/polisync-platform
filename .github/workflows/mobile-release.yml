name: Mobile Release Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-release.yml'

permissions:
  contents: read

jobs:
  validate-web-production:
    name: Validate production web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production web app
        run: npm run build

  android-release:
    name: Android release build (when native project exists)
    if: ${{ hashFiles('frontend/android/**') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build unsigned Android App Bundle
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: polisyync-android-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios-release:
    name: iOS release build (when native project exists)
    if: ${{ hashFiles('frontend/ios/**') != '' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Verify iOS project exists
        run: test -d ios/App

      - name: Archive iOS app
        working-directory: frontend/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/PoliSync.xcarchive" archive CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: polisyync-ios-archive
          path: ${{ runner.temp }}/PoliSync.xcarchive
          if-no-files-found: error

# Signing and App Store/Play Store credentials are intentionally excluded.
# Production signing must use protected CI secrets or local store tooling.
