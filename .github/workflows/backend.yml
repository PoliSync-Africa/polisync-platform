name: Test PoliSync Backend

on:
  push:
    branches:
      - main
      - fix/results-security-and-nextjs
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Verify application starts without crashing
        run: |
          set -o pipefail
          set +e
          timeout 15s node server.js 2>&1 | tee /tmp/polisync-backend.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "Backend exited unexpectedly with status $status"
            exit "$status"
          fi
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ci-test-secret
          MONGODB_URI: mongodb://127.0.0.1:27017/polisync_ci
