name: Sync Ghana EC Electoral Data

on:
  workflow_dispatch:
  schedule:
    # Run daily so PoliSync can pick up EC source updates without manual work.
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  # PoliSync production Render backend.
  POLISYNC_API_URL: https://polisync-platform-1.onrender.com

jobs:
  sync-electoral-data:
    name: Synchronize Ghana EC polling stations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate required secret
        env:
          POLISYNC_API_TOKEN: ${{ secrets.POLISYNC_API_TOKEN }}
        run: |
          test -n "$POLISYNC_API_TOKEN" || { echo "Missing GitHub Actions secret: POLISYNC_API_TOKEN"; exit 1; }

      - name: Synchronize Electoral Commission data
        env:
          POLISYNC_API_TOKEN: ${{ secrets.POLISYNC_API_TOKEN }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$(curl --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${POLISYNC_API_TOKEN}" \
            --header "Accept: application/json" \
            --output "$response_file" \
            --write-out "%{http_code}" \
            "${POLISYNC_API_URL%/}/api/setup/sync-electoral-data")"

          echo "HTTP status: ${status_code}"
          cat "$response_file"
          echo

          case "$status_code" in
            200) ;;
            *)
              echo "Electoral data synchronization failed."
              exit 1
              ;;
          esac
