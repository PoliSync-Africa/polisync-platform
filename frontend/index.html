<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoliSync Africa</title>
<link rel="stylesheet"href="styles.css">
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#071B34;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
width:90%;
max-width:380px;
padding:30px;
background:#0E2A4D;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.logo{
font-size:30px;
font-weight:bold;
text-align:center;
margin-bottom:10px;
color:#F5B400;
}

.subtitle{
text-align:center;
margin-bottom:30px;
color:#D7D7D7;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#17385F;
color:white;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-bottom:12px;
}

.signin{
background:#F5B400;
color:#071B34;
}

.google{
background:white;
color:black;
}

.apple{
background:black;
color:white;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">PoliSync</div>

<div class="subtitle">
Africa's Political Operating System
</div>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button class="signin">Sign In</button>

<button class="google">Continue with Google</button>

<button class="apple">Continue with Apple</button>

</div>
<script src="script.js"></script>
</body>
</html>
